name: 刷步数

# 2026-11-18 排查记录：定时任务未按当前计划时间触发（白天/早上档被漏掉），提交本注释用于强制 GitHub 重新注册定时计划；工作流逻辑未做任何改动。
# 2026-11-24 内置定时已停用（仅注释，未删除），改由外部定时器通过 API 触发。恢复方式：将下方两行行首的 # 去掉，并把 c-r-o-n 中间的短横线去掉即可。
on:
  # schedule:
  #   - c-r-o-n: '6 0,1,3,5,7 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y

      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install -r requirements.txt
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
